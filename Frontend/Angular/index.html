<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive website</title>
    <link rel="stylesheet" href="index.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Datatype:wght@100..900&family=Figtree:ital,wght@0,300..900;1,300..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Oswald&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav id="navbar">
      <div class="logo"><img src="assets/imgs/bmw-logo.svg" alt="logo" /></div>
      <ul>
        <li class="nav-list">All Models</li>
        <li class="nav-list">Electric</li>
        <li class="nav-list">Visit Online Shop</li>
        <li class="nav-list">More BMW</li>
      </ul>
      <div class="auth-items">
        <span class="auth-icon1">
          <img src="assets/imgs/person.png" alt="" />
        </span>
        <span class="auth-icon2">
          <img src="assets/imgs/shopping-cart.png" alt="" />
        </span>
        <span class="auth-icon3">
          <img src="assets/imgs/heart.png" alt="" />
        </span>
        <span class="auth-icon4">
          <img src="assets/imgs/placeholder.png" alt="" />
        </span>
      </div>
    </nav>
    <div class="hero">
      <img src="assets/imgs/1920_big.jpg" alt="bg_img" class="nav-img" />

      <div class="car-info">
        <span class="car-span">THE NEW </span>
        <h1>M5</h1>
        <span class="car-price">Price starting at ₹ 74,50,000.</span>
        <button class="car-btn">Know more</button>
      </div>
    </div>

    <div class="container">
      <h1>Find your BMW.</h1>
      <ul class="container-ul">
        <div class="car-tool1">
          <li class="car-logo">
            <img src="assets/imgs/car.png" alt="" srcset="" />
          </li>
          <li class="car-tools">Find a new car.</li>
          <button>Search now</button>
        </div>
        <div class="car-tool1">
          <li class="car-logo">
            <img src="assets/imgs/car-service.png" alt="" srcset="" />
          </li>
          <li class="car-tools">Book a test drive.</li>
          <button>Request a test drive</button>
        </div>
        <div class="car-tool1">
          <li class="car-logo">
            <img src="assets/imgs/car-build.png" alt="" />
          </li>
          <li class="car-tools">Build your own.</li>
          <button>Configure & Price</button>
        </div>
      </ul>
    </div>

    <!-- <div class="video">
      <video controls autoplay muted loop style="width: 100%">
        <source src="assets/videos/bmw.mp4" type="video/mp4" />
      </video>
    </div> -->
  </body>
</html>
